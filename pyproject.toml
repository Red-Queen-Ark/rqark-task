[project]
name = "rqark-task"
version = "0.1.4"
description = "Red Queen Ark Task - a worker service that claims scheduled agent runs from the data cloud and executes them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "RedQueenArk" }]
keywords = ["agent", "task", "scheduler", "worker"]
dependencies = [
    "httpx>=0.28.1",
    "redis[hiredis]>=5.2.0",
    "rqark-app==0.13.1",
    "rqark-core==0.5.3",
    "rqark-sandbox==0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rqark_task"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]

[tool.ruff]
exclude = ["*.ipynb"]
line-length = 240
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = 'single'
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ty.src]
exclude = ["tests/"]

[tool.ty.environment]
python-platform = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = []
filterwarnings = ["default"]
